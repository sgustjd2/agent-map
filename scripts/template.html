<!DOCTYPE html>
<html lang="ko" data-theme="soft"><head><meta charset="utf-8"><title>Agent Map</title>
<style>
/* Three screens: soft (default, low glare), light, dark. Large type, one accent, 4px grid, radius 4 / 8 / 12.
   Design pass after the unslop skill by Damir Sokolovsky (@heydamir), CC BY 4.0. */
:root{--side:#e6e9ed;--bg:#e6e9ed;--card:#f4f5f7;--raised:#eaedf0;--line:#bcc5cf;
--fg:#171d23;--sub:#36404b;--mut:#52606d;--accent:#0a5bc4;--onaccent:#fff;--sel:#d3e4fb;--shadow:none;
--ease:cubic-bezier(.22,1,.36,1);
--sans:"Pretendard","Geist",system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
--mono:"Geist Mono","JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace}
html[data-theme="light"]{--side:#f6f8fa;--bg:#ffffff;--card:#ffffff;--raised:#f6f8fa;--line:#d1d9e0;
--fg:#1f2328;--sub:#3d444d;--mut:#59636e;--accent:#0969da;--sel:#ddf4ff;--shadow:none}
html[data-theme="dark"]{--side:#0d1117;--bg:#0d1117;--card:#151b23;--raised:#1b222c;--line:#30363d;
--fg:#e6edf3;--sub:#b6c0cb;--mut:#8b95a1;--accent:#4493f8;--onaccent:#0d1117;--sel:#14304f;--shadow:none}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/24px var(--sans);font-variant-numeric:tabular-nums;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:24px 12px 16px}
aside h2{font:500 14px/20px var(--sans);color:var(--mut);margin:24px 12px 8px}
.gi{display:flex;align-items:center;gap:8px;min-height:40px;margin-bottom:4px;padding:0 12px;border:0;border-radius:6px;background:none;width:100%;text-align:left;color:var(--sub);cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease)}
.gi:hover{background:rgba(127,135,150,.14);color:var(--fg)}
.gi.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.gi span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi em{font:400 14px/20px var(--mono);font-style:normal;color:var(--mut)}.gi.offp{opacity:.65}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px 0}
h1{font:600 20px/28px var(--sans);margin:0}
.live{font:400 13px/20px var(--mono);color:var(--mut)}
.sp{flex:1}
.tabs{display:flex;gap:4px;margin-top:12px;align-items:flex-end}
.tab{height:40px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:none;color:var(--sub);cursor:pointer;font-size:16px;text-decoration:none;display:inline-flex;align-items:center}
.tab[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tab[aria-disabled="true"]{opacity:.5;cursor:default}
a.tab:hover{color:var(--fg)}
.tb{padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);overflow:hidden}
.body{display:grid;grid-template-columns:272px minmax(0,1fr) 400px;min-height:0}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#q{width:280px;max-width:100%;height:40px;padding:0 16px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);font:inherit;font-size:15px;transition:border-color .15s var(--ease),background-color .15s var(--ease)}
#q:focus{outline:0;border-color:var(--accent);background:var(--card)}#q::placeholder{color:var(--mut)}
.meta{margin-left:auto;white-space:nowrap;font:400 14px/20px var(--mono);color:var(--mut)}
.tools{display:flex;gap:8px}
.btn{height:36px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--sub);cursor:pointer;font-size:14px;transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{background:var(--raised);color:var(--fg)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
a.btn{display:inline-flex;align-items:center;text-decoration:none}[hidden]{display:none!important}
.cp{margin-left:8px;height:28px;padding:0 8px;font-size:13px;vertical-align:middle}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.frow{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.lab{font:500 14px/20px var(--sans);color:var(--mut);width:40px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--sub);cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.chip:hover{background:var(--raised)}
.chip.on{background:var(--sel);border-color:var(--accent);color:var(--fg);font-weight:600}
.chip i{width:8px;height:8px;border-radius:2px;margin-right:8px;background:var(--c)}
.chip b{font:400 13px/20px var(--mono);margin-left:8px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{height:34px;padding:0 12px;background:var(--card);border:0;border-left:1px solid var(--line);color:var(--sub);cursor:pointer;font-size:14px;transition:background-color .15s var(--ease)}
.seg button:first-child{border-left:0}.seg button:hover{background:var(--raised)}
.seg button.on{background:var(--accent);color:var(--onaccent);font-weight:600}
.sw{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0;margin-left:8px;background:none;border:0;color:var(--sub);cursor:pointer;font-size:14px}
.sw i{position:relative;flex:none;width:40px;height:24px;border-radius:12px;background:var(--raised);border:1px solid var(--line);transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:6px;background:var(--sub);transition:transform .15s var(--ease),background-color .15s var(--ease)}
.sw[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"] i::after{transform:translateX(16px);background:var(--onaccent)}
.sw:hover{color:var(--fg)}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;font-size:15px;padding:0 8px;height:36px;text-decoration:underline}
#bar{display:flex;gap:2px;height:8px;margin:16px -24px -12px;overflow:hidden}
#bar i{display:block;background:var(--c);transition:flex .2s var(--ease)}
#vp{grid-column:2;overflow:auto;padding:24px}
#w{display:grid;gap:24px;align-items:start}
.g{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:var(--shadow);scroll-margin-top:24px;transition:border-color .15s var(--ease)}
.g.sel{border-color:var(--accent)}.g.offp{opacity:.7}
.gh{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.gh b{font:600 22px/28px var(--sans)}.gh code{font:400 14px/20px var(--mono);color:var(--mut)}
.gd{margin:4px 0 0;color:var(--sub);font-size:15px;line-height:24px}
.k{margin-top:24px}
.kh{font:500 15px/20px var(--mono);color:var(--sub);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.cs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.c{min-height:88px;padding:12px 16px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.c:hover{background:var(--raised)}.c.sel{background:var(--sel);border-color:var(--accent)}
.c b{display:block;font:600 15px/24px var(--mono);overflow-wrap:anywhere}
.c p{margin:4px 0 0;color:var(--sub);font-size:14px;line-height:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{margin:8px 0 0;color:var(--sub);font-size:15px;line-height:24px}
.none{grid-column:1/-1;padding:48px 24px;text-align:center;color:var(--sub)}.none p{margin:0 0 12px}.none p:first-child{font-size:18px;color:var(--fg)}
#det{grid-column:3;background:var(--card);border-left:1px solid var(--line);padding:24px;overflow:auto}
#det .top2{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#det .tag{font:500 13px/20px var(--mono);color:var(--accent)}
#det .top2 .btn{display:none;height:32px;padding:0 12px;font-size:14px}
#det h3{font:600 20px/28px var(--mono);margin:0 0 4px;overflow-wrap:anywhere}
#det h4{font:500 13px/20px var(--sans);color:var(--mut);margin:24px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
#det .src{font-size:14px;line-height:20px;color:var(--sub)}
#det p{margin:0;font-size:16px;line-height:26px;white-space:pre-wrap}
#det dl{margin:0;display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px 12px;font-size:15px;line-height:24px}
#det dt{font:400 13px/24px var(--mono);color:var(--mut)}#det dd{margin:0;overflow-wrap:anywhere}
#det dd code{font:400 14px/20px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.hintbox{color:var(--sub);font-size:15px;line-height:24px}
@media (max-width:1100px){
 .body{grid-template-columns:240px minmax(0,1fr)}
 #det{display:none;position:fixed;left:240px;right:0;bottom:0;max-height:55%;grid-column:auto;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.18)}
 #det.open{display:block}#det .top2 .btn{display:inline-block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
 <div class="top"><h1>Agent Map</h1><span class="live" id="gen"></span><span class="sp"></span>
  <button class="btn" id="zo" aria-label="글자 작게" title="글자 작게">A-</button><button class="btn" id="zi" aria-label="글자 크게" title="글자 크게">A+</button><button class="btn" id="th" title="화면 모드 바꾸기"></button><button class="btn" id="lg"></button></div>
 <nav class="tabs" id="tabs" aria-label="보기"></nav>
</header>
<div class="tb">
 <div class="srow"><input id="q" type="search" placeholder="이름이나 설명으로 검색 (/)" aria-label="검색"><button class="btn" id="clr" hidden>지우기</button><span class="meta" id="meta"></span></div>
 <div class="frow"><span class="lab">종류</span><div class="chips" id="kf"></div></div>
 <div class="frow"><span class="lab">범위</span><div class="seg" id="sf"></div><button class="sw" id="offb" role="switch" aria-checked="true"><i></i><span>비활성 플러그인 포함</span></button><button class="lnk" id="rst" hidden>필터 초기화</button></div>
 <div id="bar"></div>
</div>
<div class="body">
<aside><h2>그룹</h2><div id="gl"></div></aside>
<main id="vp"><div id="w"></div></main>
<div id="det"><div class="hintbox">카드를 클릭하면 이름, 설명, 호출 방법, 파일 위치 같은 자세한 정보가 여기에 표시됩니다</div></div>
</div>
<div class="sr" role="status" aria-live="polite" id="sr"></div>
<script>
const LANG=(()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q==='ko'||q==='en')return q;const v=localStorage.getItem('agent-map-lang');if(v==='ko'||v==='en')return v}catch{}return /^ko/i.test(navigator.language||'')?'ko':'en'})();
const EN={"글자 작게":"Smaller text","글자 크게":"Larger text","화면 모드 바꾸기":"Change theme","보기":"View","이름이나 설명으로 검색 (/)":"Search by name or description (/)","검색":"Search","지우기":"Clear","종류":"Type","범위":"Scope","비활성 플러그인 포함":"Include inactive plugins","필터 초기화":"Reset filters","그룹":"Groups","카드를 클릭하면 이름, 설명, 호출 방법, 파일 위치 같은 자세한 정보가 여기에 표시됩니다":"Click a card to see its name, description, how to invoke it and where the file is","스킬":"Skills","에이전트":"Agents","커맨드":"Commands","훅":"Hooks","MCP 서버":"MCP servers","전체":"All","사용자":"User","프로젝트":"Project","플러그인":"Plugin","소프트":"Soft","라이트":"Light","다크":"Dark","화면 ":"Theme ","세션이 시작, 재개, 초기화될 때":"When a session starts, resumes or is cleared","사용자가 프롬프트를 보낸 직후, Claude가 처리하기 전":"Right after you send a prompt, before Claude processes it","도구를 실행하기 직전 (실행을 막을 수 있음)":"Just before a tool runs (can block it)","도구 실행이 끝난 직후":"Right after a tool finishes","Claude가 응답을 끝낼 때":"When Claude finishes replying","서브에이전트가 시작될 때":"When a subagent starts","서브에이전트가 끝날 때":"When a subagent finishes","알림이 발생할 때":"When a notification is raised","대화를 압축하기 직전":"Just before the conversation is compacted","세션이 끝날 때":"When the session ends","권한 요청이 나타날 때":"When a permission request appears","모든 경우":"Always"," 도구일 때만":" tool only","시작 유형: ":"Start type: ","조건: ":"Condition: ","출처":"Source"," (비활성)":" (inactive)","설명이 없습니다":"No description","호출":"Invoke","인자":"Arguments","허용 도구":"Allowed tools","파일":"File","모델":"Model","도구":"Tools","이벤트":"Event","대상":"Target","실행":"Runs","방식":"Method","제한 시간":"Timeout","초":"s","연결 방식":"Connection","주소/명령":"Address / command","복사":"Copy"," 복사":": copy","복사됨":"Copied","복사 실패":"Copy failed","을 복사했습니다":" copied","복사하지 못했습니다":"Could not copy","닫기":"Close","설명":"Description","정보":"Info","비활성":"inactive","구성 요소가 없는 플러그인":"Plugins without components"," (도구나 설정만 제공)":" (tools or settings only)","일치하는 항목이 없습니다":"No matching items"," 종류에는 없지만 다른 종류에 있습니다":" has none, but other types do","검색어나 필터를 바꿔 보세요":"Try a different search or filter","전체 종류에서 ":"Show ","개 보기":" in all types","구성 지도 · 생성 ":"Config map · generated ","실시간 서버에서만 열 수 있습니다 (/agent-map:live)":"Only available on the live server (/agent-map:live)","실시간 흐름":"Live flow","프로젝트 탭에서 세션을 선택하세요":"Pick a session on the Projects tab","구성 지도":"Config map","실시간":"Live"};
const tt=s=>LANG==='en'&&EN[s]!==undefined?EN[s]:s;
const KR=(ko,en)=>LANG==='en'?en:ko;
const GN=n=>LANG==='en'?String(n).replace(/^사용자 \(/,'User (').replace(/^프로젝트 \(/,'Project ('):n;
const DD=d=>LANG==='en'?String(d).replace(/^실행: /,'Runs: ').replace(/^종류: /,'Type: '):d;
const D=/*DATA*/null;
const K={skills:'#2f7de1',agents:'#d9822b',commands:'#2fa36b',hooks:'#8a63d2',mcp:'#d9546b'};
const KL={skills:tt('스킬'),agents:tt('에이전트'),commands:tt('커맨드'),hooks:tt('훅'),mcp:tt('MCP 서버')};
const SC={all:tt('전체'),user:tt('사용자'),project:tt('프로젝트'),plugin:tt('플러그인')};
const EV={SessionStart:tt('세션이 시작, 재개, 초기화될 때'),UserPromptSubmit:tt('사용자가 프롬프트를 보낸 직후, Claude가 처리하기 전'),PreToolUse:tt('도구를 실행하기 직전 (실행을 막을 수 있음)'),PostToolUse:tt('도구 실행이 끝난 직후'),Stop:tt('Claude가 응답을 끝낼 때'),SubagentStart:tt('서브에이전트가 시작될 때'),SubagentStop:tt('서브에이전트가 끝날 때'),Notification:tt('알림이 발생할 때'),PreCompact:tt('대화를 압축하기 직전'),SessionEnd:tt('세션이 끝날 때'),PermissionRequest:tt('권한 요청이 나타날 때')};
const TOOLEV=new Set(['PreToolUse','PostToolUse','PermissionRequest']);
const TH=['soft','light','dark'],THN={soft:tt('소프트'),light:tt('라이트'),dark:tt('다크')};
const st={kind:'all',scope:'all',q:'',off:true};
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const vp=document.getElementById('vp'),w=document.getElementById('w'),det=document.getElementById('det');
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const inScope=g=>(st.scope==='all'||g.kind===st.scope)&&(st.off||g.enabled!==false);
const hit=x=>!st.q||(x.name+' '+x.desc).toLowerCase().includes(st.q);
const kinds=()=>st.kind==='all'?Object.keys(K):[st.kind];
const items=(g,k)=>g[k].filter(hit);
const total=g=>kinds().reduce((n,k)=>n+items(g,k).length,0);
function counts(){const c={};for(const k in K)c[k]=0;for(const g of D.groups)if(inScope(g))for(const k in K)c[k]+=items(g,k).length;return c}
const cols=()=>Math.max(1,Math.min(3,Math.floor((vp.clientWidth-48+24)/(420+24))));
const pfx=g=>g.kind==='plugin'?g.name+':':'';
function hookText(x){return x.event?(EV[x.event]||x.event):''}
function matcherText(x){if(!x.matcher)return tt('모든 경우');if(TOOLEV.has(x.event))return x.matcher+tt(' 도구일 때만');if(x.event==='SessionStart')return tt('시작 유형: ')+x.matcher;return tt('조건: ')+x.matcher}
function cardText(k,x){return k==='hooks'?`${hookText(x)}${x.script?' · '+x.script:''}`:(x.desc||'')}
function detail(k,x,g){
 const src=GN(g.name)+(g.version?' v'+String(g.version).slice(0,8):'');
 const rows=[[tt('출처'),src],[tt('범위'),SC[g.kind]+(g.enabled===false?tt(' (비활성)'):'')]];
 let body=x.desc||tt('설명이 없습니다');
 if(k==='skills'||k==='commands')rows.push([tt('호출'),`/${pfx(g)}${x.name}`],[tt('인자'),x.hint],[tt('허용 도구'),x.tools],[tt('파일'),x.file]);
 if(k==='agents')rows.push([tt('호출'),`${pfx(g)}${x.name}`],[tt('모델'),x.extra],[tt('도구'),x.tools],[tt('파일'),x.file]);
 if(k==='hooks'){body=KR(`이 훅은 ${x.event} 이벤트에 연결돼 있습니다.\n발동 시점: ${hookText(x)}\n대상: ${matcherText(x)}${x.script?'\n실행 파일: '+x.script:''}`,`This hook is attached to the ${x.event} event.\nFires: ${hookText(x)}\nTarget: ${matcherText(x)}${x.script?'\nRuns: '+x.script:''}`);
  rows.push([tt('이벤트'),x.event],[tt('대상'),matcherText(x)],[tt('실행'),x.script],[tt('방식'),x.htype],[tt('제한 시간'),x.timeout?x.timeout+tt('초'):''])}
 if(k==='mcp'){body=KR(`${x.name} MCP 서버입니다. Claude가 이 서버의 도구를 사용할 수 있습니다.`,`${x.name} is an MCP server. Claude can use this server's tools.`);rows.push([tt('연결 방식'),x.type],[tt('주소/명령'),x.desc])}
 return {body,rows:rows.filter(r=>r[1])}}
function copyBtn(text,what){const b=$('button','btn sm cp',tt('복사'));b.setAttribute('aria-label',what+tt(' 복사'));
 b.onclick=async()=>{let ok=true;try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();try{ok=document.execCommand('copy')}catch{ok=false}t.remove()}
  b.textContent=ok?tt('복사됨'):tt('복사 실패');document.getElementById('sr').textContent=ok?what+tt('을 복사했습니다'):tt('복사하지 못했습니다');setTimeout(()=>b.textContent=tt('복사'),1500)};return b}
function showDet(k,x,g){const d=detail(k,x,g);det.textContent='';
 const t=$('div','top2');t.append($('span','tag',KL[k]));const cb=$('button','btn',tt('닫기'));cb.onclick=()=>det.classList.remove('open');t.append(cb);
 const dl=$('dl');for(const [a,b] of d.rows){dl.append($('dt',0,a));const dd=$('dd');if([tt('호출'),tt('파일'),tt('실행'),tt('주소/명령')].includes(a)){dd.append($('code',0,b));if(a===tt('호출')||a===tt('파일'))dd.append(copyBtn(b,a))}else dd.textContent=b;dl.append(dd)}
 det.append(t,$('h3',0,x.name),$('div','src',GN(g.name)),$('h4',0,tt('설명')),$('p',0,d.body),$('h4',0,tt('정보')),dl);det.classList.add('open');det.scrollTop=0}
function toolbar(){const c=counts(),all=Object.values(c).reduce((a,b)=>a+b,0);
 const kf=document.getElementById('kf');kf.textContent='';
 const mk=(key,label,n,col)=>{const b=$('button','chip'+(st.kind===key?' on':''));if(col){const i=$('i');i.style.setProperty('--c',col);b.append(i)}b.append(document.createTextNode(label),$('b',0,String(n)));b.setAttribute('aria-pressed',st.kind===key);b.onclick=()=>{st.kind=key;render()};return b};
 kf.append(mk('all',tt('전체'),all));for(const k in K)kf.append(mk(k,KL[k],c[k],K[k]));
 const sf=document.getElementById('sf');sf.textContent='';
 for(const s in SC){const b=$('button',st.scope===s?'on':'',SC[s]);b.setAttribute('aria-pressed',st.scope===s);b.onclick=()=>{st.scope=s;render()};sf.append(b)}
 const bar=document.getElementById('bar');bar.textContent='';for(const k in K){const i=$('i');i.style.flex=String(c[k]||0);i.style.setProperty('--c',K[k]);bar.append(i)}
 document.getElementById('meta').textContent=KR(`${st.kind==='all'?all:c[st.kind]}개 항목`,`${st.kind==='all'?all:c[st.kind]} items`);
 document.getElementById('rst').hidden=!(st.q||st.kind!=='all'||st.scope!=='all'||!st.off);document.getElementById('clr').hidden=!st.q}
function draw(){w.textContent='';const gl=document.getElementById('gl');gl.textContent='';
 const n=cols();w.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
 const gs=D.groups.filter(inScope);
 const full=gs.filter(g=>total(g)),empty=gs.filter(g=>!Object.keys(K).some(k=>g[k].length));
 for(const g of full){
  const t=total(g),box=$('div','g'+(g.enabled===false?' offp':''));box.style.gridColumn='span '+Math.min(n,t<=6?1:t<=20?2:3);
  const h=$('div','gh');h.append($('b',0,GN(g.name)),...[SC[g.kind],g.enabled===false?tt('비활성'):'',g.version?'v'+String(g.version).slice(0,8):''].filter(Boolean).map(x=>$('code',0,x)));box.append(h);
  if(g.description&&!st.q)box.append($('p','gd',g.description));
  for(const k of kinds()){const it=items(g,k);if(!it.length)continue;
   const kb=$('div','k');kb.append($('div','kh',`${KL[k]} ${it.length}`));const cs=$('div','cs');
   for(const x of it){const c=$('button','c');c.append($('b',0,x.name),$('p',0,cardText(k,x)));
    c.onclick=()=>{document.querySelectorAll('.c.sel').forEach(y=>y.classList.remove('sel'));c.classList.add('sel');showDet(k,x,g)};cs.append(c)}
   kb.append(cs);box.append(kb)}
  w.append(box);
  const gi=$('button','gi'+(g.enabled===false?' offp':''));gi.append($('span',0,GN(g.name)),$('em',0,String(t)));
  gi.onclick=()=>{document.querySelectorAll('.g.sel').forEach(e=>e.classList.remove('sel'));document.querySelectorAll('.gi.on').forEach(e=>e.classList.remove('on'));box.classList.add('sel');gi.classList.add('on');box.scrollIntoView({behavior:'smooth',block:'start'})};gl.append(gi)}
 if(empty.length&&!st.q&&st.kind==='all'){const box=$('div','g');const h=$('div','gh');h.append($('b',0,tt('구성 요소가 없는 플러그인')));box.append(h,$('p','empty',empty.map(g=>g.name).join(', ')+tt(' (도구나 설정만 제공)')));w.append(box)}
 if(!w.children.length){const box=$('div','none');const all=Object.values(counts()).reduce((a,b)=>a+b,0);
  box.append($('p',0,tt('일치하는 항목이 없습니다')));
  if(st.kind!=='all'&&all){const b=$('button','btn',tt('전체 종류에서 ')+all+tt('개 보기'));b.onclick=()=>{st.kind='all';render()};box.append($('p',0,KL[st.kind]+tt(' 종류에는 없지만 다른 종류에 있습니다')),b)}
  else box.append($('p',0,tt('검색어나 필터를 바꿔 보세요')));
  w.append(box)}}
function render(){toolbar();draw()}
const q=document.getElementById('q'),ob=document.getElementById('offb');
q.oninput=()=>{st.q=q.value.trim().toLowerCase();render()};
document.getElementById('clr').onclick=()=>{q.value='';st.q='';render();q.focus()};
document.getElementById('rst').onclick=()=>{q.value='';ob.setAttribute('aria-checked','true');Object.assign(st,{kind:'all',scope:'all',q:'',off:true});render()};
ob.onclick=()=>{st.off=!st.off;ob.setAttribute('aria-checked',String(st.off));render()};
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}else if(e.key==='Escape'){if(st.q){q.value='';st.q='';render()}det.classList.remove('open')}});
let zoom=+(store.get('agent-map-zoom')||1);
const setZoom=z=>{zoom=Math.min(1.5,Math.max(.8,Math.round(z*100)/100));document.documentElement.style.zoom=zoom;store.set('agent-map-zoom',zoom)};
document.getElementById('zi').onclick=()=>{setZoom(zoom+.1);draw()};document.getElementById('zo').onclick=()=>{setZoom(zoom-.1);draw()};
let th=store.get('agent-map-theme');if(!TH.includes(th))th='soft';{const qt=new URLSearchParams(location.search).get('theme');if(TH.includes(qt))th=qt} /* ?theme=soft|light|dark, handy for screenshots */
const thb=document.getElementById('th');
const setTheme=t=>{th=t;document.documentElement.dataset.theme=t;thb.textContent=tt('화면 ')+THN[t];store.set('agent-map-theme',t)};
thb.onclick=()=>setTheme(TH[(TH.indexOf(th)+1)%TH.length]);
addEventListener('resize',draw);
{const d=new Date(D.generatedAt),p=n=>String(n).padStart(2,'0');document.getElementById('gen').textContent=tt('구성 지도 · 생성 ')+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
{ /* same tabs as the live dashboard; the live tab only works when served by the live server */
 const nav=document.getElementById('tabs'),live=/^https?:$/.test(location.protocol),off=tt('실시간 서버에서만 열 수 있습니다 (/agent-map:live)');
 const mk=(label,href,cur,tip)=>{const link=href&&live&&!cur,a=$(link?'a':'span','tab',label);if(link)a.href=href;else if(cur)a.setAttribute('aria-current','page');else{a.setAttribute('aria-disabled','true');a.title=tip}return a};
 nav.append(mk(tt('실시간'),'/',false,off),mk(tt('실시간 흐름'),'/#m',false,off),mk(tt('구성 지도'),'',true))}
function localize(){document.documentElement.lang='en';const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);for(let n;n=w.nextNode();){const t=n.nodeValue.trim();if(t&&EN[t])n.nodeValue=n.nodeValue.replace(t,EN[t])}for(const e of document.querySelectorAll('[title],[aria-label],[placeholder]'))for(const a of ['title','aria-label','placeholder']){const v=e.getAttribute(a);if(v&&EN[v])e.setAttribute(a,EN[v])}}
document.getElementById('lg').textContent=LANG==='en'?'한국어':'English';document.getElementById('lg').onclick=()=>{store.set('agent-map-lang',LANG==='en'?'ko':'en');location.reload()};
if(LANG==='en')localize();
setTheme(th);setZoom(zoom);render();
</script></body></html>
