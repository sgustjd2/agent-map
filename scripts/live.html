<!DOCTYPE html>
<html lang="ko" data-theme="soft"><head><meta charset="utf-8"><title>Agent Map 실시간</title>
<style>
/* Same three screens as the config map. Status colors carry meaning only. Design after the unslop skill by Damir Sokolovsky (@heydamir), CC BY 4.0. */
:root{--side:#dde2ea;--bg:#e8ebf0;--card:#f3f5f8;--raised:#dbe0e8;--line:rgba(31,39,51,.15);
--fg:#1f2733;--sub:#3d4859;--mut:#535f72;--accent:#1a5fbf;--onaccent:#fff;--sel:#d6e4f8;--shadow:0 1px 2px rgba(31,39,51,.08);
--run:#1d8a55;--idle:#9a6a12;--dorm:#6b7487;--err:#c0392b;--ease:cubic-bezier(.22,1,.36,1);
--sans:"Pretendard","Geist",system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
--mono:"Geist Mono","JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
--c-read:#2f7de1;--c-write:#d9822b;--c-bash:#2fa36b;--c-agent:#8a63d2;--c-other:#7a8296}
html[data-theme="light"]{--side:#eceff4;--bg:#f5f7fa;--card:#ffffff;--raised:#e8ecf3;--line:rgba(17,24,39,.12);--fg:#111827;--sub:#434d5e;--mut:#5f6a7d;--accent:#1a64c8;--sel:#e6f0fd;--shadow:0 1px 2px rgba(17,24,39,.06)}
html[data-theme="dark"]{--side:#07080d;--bg:#0b0d14;--card:#11141c;--raised:#1a1e28;--line:rgba(238,240,245,.13);--fg:#e6e9f0;--sub:#b7bdca;--mut:#8d95a8;--accent:#6cb4ff;--onaccent:#07101c;--sel:#16304e;--shadow:none;--run:#4cc38a;--idle:#e0b050;--dorm:#8d95a8;--err:#ef7a6c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/24px var(--sans);font-variant-numeric:tabular-nums;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 24px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font:600 20px/28px var(--sans);margin:0}
.live{font:400 13px/20px var(--mono);color:var(--mut);display:flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--run)}.live.off i{background:var(--err)}
.sp{flex:1}
.btn{height:36px;padding:0 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--sub);cursor:pointer;font-size:14px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.btn:hover{background:var(--raised);color:var(--fg)}
select{height:36px;padding:0 8px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:14px}
.chk{display:inline-flex;align-items:center;gap:8px;color:var(--sub);font-size:15px;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{height:40px;padding:0 16px;border:0;border-bottom:2px solid transparent;background:none;color:var(--sub);cursor:pointer;font-size:16px}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}.tab:disabled{opacity:.5;cursor:default}
.sum{display:flex;gap:24px;margin-top:8px;color:var(--sub);font-size:15px}.sum b{font:600 15px/24px var(--mono);color:var(--fg);margin-left:4px}
main{overflow:auto;padding:24px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:24px;align-items:start}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow)}
.p.run{border-color:var(--run)}
.ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.ph b{font:600 20px/28px var(--sans)}
.path{font:400 13px/20px var(--mono);color:var(--mut);margin:0;overflow-wrap:anywhere}
.st{display:inline-flex;align-items:center;gap:6px;font:500 14px/20px var(--sans)}.st i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.st.running{--c:var(--run);color:var(--run)}.st.idle{--c:var(--idle);color:var(--idle)}.st.dormant{--c:var(--dorm);color:var(--dorm)}
.stat{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;color:var(--sub);font-size:15px}
.tl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tl span{font:400 13px/20px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 8px;color:var(--sub)}
.ss{margin-top:16px;border-top:1px solid var(--line)}
.s{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 8px;cursor:pointer;border-radius:8px;transition:background-color .15s var(--ease)}
.s:hover{background:var(--raised)}
.s .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s .m{grid-column:1/-1;font:400 13px/20px var(--mono);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{margin-top:8px}
.none{padding:48px 24px;text-align:center;color:var(--sub)}
/* flow */
.fh{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px}
.fh h2{font:600 20px/28px var(--sans);margin:0 0 4px}
.kv{display:flex;gap:24px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--sub)}.kv b{font:400 13px/20px var(--mono);color:var(--mut);margin-right:8px}
#flow{display:flex;flex-wrap:wrap;gap:12px 0;align-items:stretch}
.n{display:flex;align-items:center}
.nd{width:172px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--c-other));border-radius:8px;padding:8px 12px;box-shadow:var(--shadow)}
.nd.run{border-color:var(--accent);border-left-color:var(--c,var(--c-other));background:var(--sel)}
.nd.err{border-color:var(--err)}
.nd b{display:block;font:600 14px/20px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nd .tg{font:400 13px/20px var(--mono);color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:20px}
.nd .tm{font:400 12px/16px var(--mono);color:var(--mut);display:flex;justify-content:space-between}
.nd .tm em{font-style:normal;color:var(--accent)}.nd.err .tm em{color:var(--err)}
.cn{width:36px;text-align:center;font:400 12px/16px var(--mono);color:var(--mut)}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 16px;font-size:14px;color:var(--sub)}.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
 <div class="top"><h1>Agent Map 실시간</h1><span class="live" id="live"><i></i><span id="lt">연결 중</span></span><span class="sp"></span>
  <label class="chk"><input type="checkbox" id="scr">임시 작업 폴더 포함</label>
  <select id="days" aria-label="기간"><option value="1">최근 1일</option><option value="3" selected>최근 3일</option><option value="7">최근 7일</option><option value="30">최근 30일</option></select>
  <button class="btn" id="zo" title="글자 작게">A-</button><button class="btn" id="zi" title="글자 크게">A+</button><button class="btn" id="th"></button></div>
 <div class="tabs"><button class="tab on" id="t1">프로젝트</button><button class="tab" id="t2" disabled>실시간 흐름</button></div>
 <div class="sum" id="sum"></div>
</header>
<main id="main"><div id="grid"></div><div id="fv" hidden></div></main>
<script>
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ST={running:'작업 중',idle:'대기',dormant:'휴면'};
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const view={tab:'p',sel:null,expanded:new Set()};
let data=null,fdata=null,fail=0;
const ago=ts=>{const s=Math.max(0,(Date.now()-Date.parse(ts))/1000);if(s<10)return'방금';if(s<60)return Math.floor(s)+'초 전';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';return Math.floor(s/86400)+'일 전'};
const hms=ts=>ts?new Date(ts).toLocaleTimeString('ko-KR',{hour12:false}):'';
const dur=(a,b)=>{const s=Math.round((Date.parse(b)-Date.parse(a))/1000);return isNaN(s)?'':s<1?'':s<60?s+'초':Math.floor(s/60)+'분'+(s%60?s%60+'초':'')};
const cat=e=>e.k==='agent'?'--c-agent':e.k!=='tool'?'--c-other':/^(Read|Grep|Glob|WebFetch|WebSearch|LSP)$/.test(e.name)?'--c-read':/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(e.name)?'--c-write':/^(Bash|PowerShell|Monitor)$/.test(e.name)?'--c-bash':'--c-other';
const lastText=l=>l?`${l.name}${l.target?' '+l.target:''}`:'';
function sessionRow(p,s){const b=$('button','s');const t=$('span','t',s.title);const st=$('span','st '+s.status);st.append($('i'),document.createTextNode(ST[s.status]));
 b.append(t,st,$('span','m',[lastText(s.last),s.branch&&s.branch!=='HEAD'?s.branch:'',ago(s.lastTs)].filter(Boolean).join('  ·  ')));
 b.onclick=()=>{view.sel={dir:p.dir,sid:s.sid,name:p.name};fdata=null;setTab('f');pollFlow()};return b}
function drawProjects(){const g=document.getElementById('grid');g.textContent='';if(!data)return;
 const showScr=document.getElementById('scr').checked;
 const ps=data.projects.filter(p=>showScr||!p.scratch);
 const run=ps.reduce((n,p)=>n+p.running,0),ses=ps.reduce((n,p)=>n+p.sessions.length,0);
 const sum=document.getElementById('sum');sum.textContent='';
 for(const [a,b] of [['프로젝트',ps.length],['세션',ses],['작업 중',run]]){const s=$('span',0,a);s.append($('b',0,String(b)));sum.append(s)}
 if(!ps.length){g.append($('div','none','표시할 프로젝트가 없습니다. 기간을 늘리거나 임시 작업 폴더를 포함해 보세요'));return}
 for(const p of ps){const c=$('div','p'+(p.running?' run':''));
  const h=$('div','ph');h.append($('b',0,p.name));
  const top=p.running?'running':(Date.now()-Date.parse(p.lastTs)<30*60e3?'idle':'dormant');const st=$('span','st '+top);st.append($('i'),document.createTextNode(ST[top]));h.append(st);c.append(h,$('p','path',p.cwd||p.dir));
  const stat=$('div','stat');stat.append($('span',0,`세션 ${p.sessions.length}`),$('span',0,`작업 중 ${p.running}`),$('span',0,`마지막 활동 ${ago(p.lastTs)}`));c.append(stat);
  if(p.top.length){const tl=$('div','tl');for(const [n,k] of p.top)tl.append($('span',0,`${n} ${k}`));c.append(tl)}
  if(p.skills.length){const tl=$('div','tl');for(const n of p.skills)tl.append($('span',0,'skill '+n));c.append(tl)}
  const ss=$('div','ss');const open=view.expanded.has(p.dir),list=open?p.sessions:p.sessions.slice(0,4);
  for(const s of list)ss.append(sessionRow(p,s));
  if(p.sessions.length>4){const m=$('button','btn more',open?'접기':`세션 ${p.sessions.length-4}개 더 보기`);m.onclick=()=>{open?view.expanded.delete(p.dir):view.expanded.add(p.dir);drawProjects()};ss.append(m)}
  c.append(ss);g.append(c)}}
function drawFlow(){const fv=document.getElementById('fv');const keep=fv.parentElement.scrollHeight-fv.parentElement.scrollTop-fv.parentElement.clientHeight<120;fv.textContent='';
 if(!fdata){fv.append($('div','none','불러오는 중'));return}
 const f=fdata,h=$('div','fh');const t=$('h2',0,f.title);const st=$('span','st '+f.status);st.style.marginLeft='12px';st.append($('i'),document.createTextNode(ST[f.status]));t.append(st);
 h.append(t,$('p','path',f.cwd));
 const kv=$('div','kv');for(const [a,b] of [['프로젝트',view.sel.name],['브랜치',f.branch&&f.branch!=='HEAD'?f.branch:''],['모델',f.model],['도구 호출',String(f.nTools)],['서브에이전트',String(f.agents)],['마지막 활동',ago(f.lastTs)]].filter(x=>x[1])){const s=$('span');s.append($('b',0,a),document.createTextNode(b));kv.append(s)}
 h.append(kv);fv.append(h);
 const lg=$('div','leg');for(const [n,v] of [['읽기·검색','--c-read'],['수정·쓰기','--c-write'],['명령 실행','--c-bash'],['서브에이전트','--c-agent'],['기타','--c-other']]){const s=$('span');const i=$('i');i.style.setProperty('--c',`var(${v})`);s.append(i,document.createTextNode(n));lg.append(s)}fv.append(lg);
 const fl=$('div');fl.id='flow';let prev=null;
 for(const e of f.events){const n=$('div','n');
  if(prev){const d=dur(prev.t2||prev.t,e.t);n.append($('div','cn',d?'+'+d:'›'))}
  const nd=$('div','nd'+(e.s==='run'?' run':e.s==='err'?' err':''));nd.style.setProperty('--c',`var(${cat(e)})`);
  nd.append($('b',0,e.k==='agent'?'서브에이전트':e.name),$('div','tg',e.k==='agent'?e.target:e.target||(e.k==='tool'?'':'')));
  const tm=$('div','tm');tm.append($('span',0,hms(e.t)));if(e.s==='run')tm.append($('em',0,'진행 중'));else if(e.s==='err')tm.append($('em',0,'오류'));nd.append(tm);
  n.append(nd);fl.append(n);prev=e}
 fv.append(fl);if(keep)fv.parentElement.scrollTop=fv.parentElement.scrollHeight}
function setTab(t){view.tab=t;document.getElementById('grid').hidden=t!=='p';document.getElementById('fv').hidden=t!=='f';
 document.getElementById('t1').classList.toggle('on',t==='p');document.getElementById('t2').classList.toggle('on',t==='f');document.getElementById('t2').disabled=!view.sel;
 if(t==='p')drawProjects();else drawFlow()}
document.getElementById('t1').onclick=()=>setTab('p');document.getElementById('t2').onclick=()=>{if(view.sel)setTab('f')};
async function pollState(){try{const r=await fetch('/api/state?days='+document.getElementById('days').value);if(!r.ok)throw 0;data=await r.json();fail=0;
  document.getElementById('live').classList.remove('off');document.getElementById('lt').textContent='실시간 · 2초마다 갱신 · '+hms(new Date())}
 catch{fail++;document.getElementById('live').classList.add('off');document.getElementById('lt').textContent='연결 끊김 (서버가 종료됐을 수 있습니다)'}
 if(view.tab==='p')drawProjects()}
async function pollFlow(){if(!view.sel||view.tab!=='f')return;try{const r=await fetch(`/api/flow?dir=${encodeURIComponent(view.sel.dir)}&sid=${encodeURIComponent(view.sel.sid)}`);if(r.ok){fdata=await r.json()}}catch{}drawFlow()}
function tick(){if(document.hidden)return;pollState();pollFlow()}
setInterval(tick,2000);document.addEventListener('visibilitychange',tick);
document.getElementById('scr').onchange=drawProjects;document.getElementById('days').onchange=pollState;
const TH=['soft','light','dark'],THN={soft:'소프트',light:'라이트',dark:'다크'};let th=store.get('agent-map-theme');if(!TH.includes(th))th='soft';
const thb=document.getElementById('th');const setTheme=t=>{th=t;document.documentElement.dataset.theme=t;thb.textContent='화면 '+THN[t];store.set('agent-map-theme',t)};thb.onclick=()=>setTheme(TH[(TH.indexOf(th)+1)%TH.length]);
let zoom=+(store.get('agent-map-zoom')||1);const setZoom=z=>{zoom=Math.min(1.5,Math.max(.8,Math.round(z*100)/100));document.documentElement.style.zoom=zoom;store.set('agent-map-zoom',zoom)};
document.getElementById('zi').onclick=()=>setZoom(zoom+.1);document.getElementById('zo').onclick=()=>setZoom(zoom-.1);
setTheme(th);setZoom(zoom);tick();
</script></body></html>
