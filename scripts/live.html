<!DOCTYPE html>
<html lang="ko" data-theme="soft"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Map 실시간</title>
<style>
/* Flat, list-based layout in the spirit of GitHub Actions run lists and trace viewers: one bordered list, 1px row dividers,
   status as icon + text + tinted row (not color dots), 6px radius, no shadows. Needs-attention rows (working, waiting for you)
   are tinted and bold in every theme, including the light ones. Accessibility patterns after the ui-styling skill.
   Original design pass after the unslop skill by Damir Sokolovsky (@heydamir), CC BY 4.0. */
:root{--canvas:#e6e9ed;--surface:#f4f5f7;--subtle:#eaedf0;--line:#bcc5cf;--line2:#d5dce3;
--fg:#171d23;--sub:#36404b;--mut:#52606d;--accent:#0a5bc4;--onaccent:#fff;--sel:#d3e4fb;--hover:rgba(23,29,35,.06);
--run:#11622a;--run-bg:#c7ecd2;--run-bar:#1a8a39;--wait:#744b00;--wait-bg:#fae09a;--wait-bar:#c78600;--err:#b3261e;--err-bg:#fbd3cf;--dorm:#52606d;--onicon:#fff;
--r:6px;--ease:cubic-bezier(.22,1,.36,1);
--sans:"Pretendard","Geist",system-ui,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
--mono:"Geist Mono","JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
--c-read:#2f7de1;--c-write:#d9822b;--c-bash:#2fa36b;--c-agent:#8a63d2;--c-mcp:#d9546b;--c-other:#7a8296}
html[data-theme="light"]{--canvas:#ffffff;--surface:#ffffff;--subtle:#f6f8fa;--line:#d1d9e0;--line2:#e6eaef;
--fg:#1f2328;--sub:#3d444d;--mut:#59636e;--accent:#0969da;--sel:#ddf4ff;--hover:rgba(31,35,40,.05);
--run:#0f5e26;--run-bg:#d3f5dc;--run-bar:#1a7f37;--wait:#6f4400;--wait-bg:#ffeeaa;--wait-bar:#bf8700;--err:#cf222e;--err-bg:#ffe0dc;--dorm:#59636e}
html[data-theme="dark"]{--canvas:#0d1117;--surface:#151b23;--subtle:#1b222c;--line:#30363d;--line2:#242b34;
--fg:#e6edf3;--sub:#b6c0cb;--mut:#8b95a1;--accent:#4493f8;--onaccent:#0d1117;--sel:#14304f;--hover:rgba(230,237,243,.06);
--run:#3fb950;--run-bg:rgba(63,185,80,.14);--run-bar:#3fb950;--wait:#e3b341;--wait-bg:rgba(227,179,65,.15);--wait-bar:#e3b341;--err:#ff7b72;--err-bg:rgba(255,123,114,.14);--dorm:#8b95a1;--onicon:#0d1117}
*{box-sizing:border-box}html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--canvas);color:var(--fg);font:400 15px/22px var(--sans);font-variant-numeric:tabular-nums;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}
button,select,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{display:inline-flex;width:20px;height:20px;flex:none}.ic svg{width:20px;height:20px}.ic .m{stroke:var(--onicon)}
.ic.running{color:var(--run)}.ic.idle{color:var(--wait)}.ic.dormant{color:var(--dorm)}
/* header */
header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px 0}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:600 16px/24px var(--sans);margin:0}
.live{font:400 12px/18px var(--mono);color:var(--mut);display:flex;align-items:center;gap:8px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--run-bar)}.live.off{color:var(--err)}.live.off i{background:var(--err)}
.sp{flex:1}
.tabs{display:flex;gap:2px;margin-top:6px}
.tab{height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--sub);cursor:pointer;font:500 14px/1 var(--sans);text-decoration:none;display:inline-flex;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}.tab:disabled{opacity:.45;cursor:default}
.tab:hover:not(:disabled){color:var(--fg);background:var(--hover)}
/* controls */
.btn{height:32px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--fg);cursor:pointer;font:500 13.5px/1 var(--sans);transition:background-color .12s var(--ease)}
.btn:hover{background:var(--hover)}.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff;font-weight:600}.btn.danger:hover{filter:brightness(1.08);background:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;font:500 13px/1 var(--sans);padding:0 4px;height:28px;text-decoration:underline}
.sch{position:relative}.sch svg{position:absolute;left:10px;top:9px;width:14px;height:14px;color:var(--mut);pointer-events:none}
input[type=search]{height:32px;width:280px;padding:0 10px 0 30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:14px}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}input::placeholder{color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{height:30px;padding:0 12px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--sub);cursor:pointer;font:500 13px/1 var(--sans)}
.seg button:first-child{border-left:0}.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--accent);font-weight:700}
.seg b{font:400 12px/1 var(--mono);margin-left:6px;opacity:.85}
.sw{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0;background:none;border:0;color:var(--sub);cursor:pointer;font:500 13px/1 var(--sans)}
.sw i{position:relative;flex:none;width:34px;height:20px;border-radius:10px;background:var(--subtle);border:1px solid var(--line)}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:var(--mut);transition:transform .12s var(--ease)}
.sw[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}.sw[aria-checked="true"] i::after{transform:translateX(14px);background:var(--onaccent)}
/* projects: sidebar + list */
.wrap{display:flex;flex-direction:column;min-height:0}
.pv{flex:1;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:0}
.side{border-right:1px solid var(--line);background:var(--canvas);overflow:auto;padding:16px 8px}
.sh{font:600 12px/20px var(--sans);color:var(--mut);padding:0 12px 6px}
.si2{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 12px 0 10px;border:0;border-left:2px solid transparent;border-radius:var(--r);background:none;color:var(--sub);text-align:left;cursor:pointer;font:500 14px/20px var(--sans)}
.si2:hover{background:var(--hover);color:var(--fg)}
.si2.on{background:var(--sel);color:var(--fg);border-left-color:var(--accent);font-weight:600}
.si2 .sn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{display:inline-flex;gap:4px}.sc i{font:600 11.5px/18px var(--mono);font-style:normal;min-width:20px;text-align:center;padding:0 5px;border-radius:9px;color:#fff}
.sc i.run{background:var(--run-bar)}.sc i.idle{background:var(--wait-bar)}
.pm{overflow:auto;padding:16px 24px 32px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.sum{margin-left:auto;color:var(--sub);font-size:13px}.sum b{font:600 13px/20px var(--mono);color:var(--fg);margin:0 10px 0 4px}
.phd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin-bottom:16px}
.phn{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.phn b{font:600 20px/28px var(--sans)}
.path{font:400 12.5px/20px var(--mono);color:var(--mut);margin:0;overflow-wrap:anywhere}
.pa{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}.gone{font:600 13px/20px var(--sans);color:var(--wait)}
.pst{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;color:var(--sub);font-size:14px}.pst .run{color:var(--run);font-weight:700}
.use{margin-top:14px}.ul{font:600 12px/20px var(--sans);color:var(--mut);margin-bottom:6px}
.ur{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(40px,1fr) 32px;gap:10px;align-items:center;min-height:22px}
.un{font:400 12.5px/20px var(--mono);color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ub{display:block;height:6px;border-radius:3px;background:var(--line2);overflow:hidden}.ub i{display:block;height:100%;background:var(--accent);border-radius:3px}
.uc{font:400 12px/16px var(--mono);color:var(--mut);text-align:right}
.tl{display:flex;gap:6px;flex-wrap:wrap}.tl span{font:400 12.5px/20px var(--mono);border:1px solid var(--line);border-radius:var(--r);padding:0 8px;color:var(--sub);background:var(--subtle)}
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.gr{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--subtle);border-bottom:1px solid var(--line);font:700 13px/20px var(--sans)}
.gr .gc{font:600 12px/20px var(--mono);margin-left:2px}
.gr.running{color:var(--run)}.gr.idle{color:var(--wait)}.gr.dormant{color:var(--dorm)}.gr.name{color:var(--fg)}
.gr .ic,.gr .ic svg{width:16px;height:16px}
.r{position:relative;border-bottom:1px solid var(--line2)}.r:last-child{border-bottom:0}
.rm{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:0 12px;align-items:center;width:100%;padding:11px 16px 11px 13px;border:0;border-left:3px solid transparent;background:none;text-align:left;cursor:pointer;color:inherit}
.r.running{background:var(--run-bg)}.r.running .rm{border-left-color:var(--run-bar)}
.r.idle{background:var(--wait-bg)}.r.idle .rm{border-left-color:var(--wait-bar)}
.r:hover{filter:brightness(.97)}.r.dormant:hover{filter:none;background:var(--hover)}
.rt{font:600 15px/22px var(--sans);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.r.dormant .rt{font-weight:500;color:var(--sub)}
.etag{font:700 12px/18px var(--sans);color:var(--err);margin-left:8px}
.rmeta{font:400 12.5px/18px var(--mono);color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.r.dormant .rmeta{color:var(--mut)}
.rr{text-align:right;min-width:92px}.rs{display:block;font:700 13px/18px var(--sans)}.rtm{display:block;font:400 12.5px/18px var(--sans);color:var(--sub)}
.rs.running{color:var(--run)}.rs.idle{color:var(--wait)}.rs.dormant{color:var(--dorm);font-weight:600}
.rx{position:absolute;right:12px;top:50%;transform:translateY(-50%);opacity:0;height:28px}
.r:hover .rx,.rx:focus-visible{opacity:1}
.more{display:block;width:100%;padding:10px 16px;border:0;border-top:1px solid var(--line2);background:var(--subtle);color:var(--accent);font:600 13px/20px var(--sans);text-align:left;cursor:pointer}
.more:hover{background:var(--hover)}
.none{padding:48px 24px;text-align:center;color:var(--sub)}.none p{margin:0 0 8px}.none p:first-child{font-size:16px;color:var(--fg);font-weight:600}
.ro .pa .btn,.ro .rx,.ro .fa,.ro #trashb,.ro #txtb,.ro .cleanb,.ro a.tab{display:none!important}
/* flow */
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.bc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--sub)}.bc b{color:var(--fg);font-weight:600}
.leg button{display:inline-flex;align-items:center;gap:6px}.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c)}
main{flex:1;overflow:auto;padding:20px 24px 32px;position:relative;min-height:0}
.fh{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
.fh h2{font:600 20px/28px var(--sans);margin:0 0 2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stt{font:700 13px/20px var(--sans);display:inline-flex;align-items:center;gap:6px}.stt.running{color:var(--run)}.stt.idle{color:var(--wait)}.stt.dormant{color:var(--dorm)}
.kv{display:flex;gap:24px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--sub)}.kv b{font:500 12.5px/20px var(--mono);color:var(--mut);margin-right:8px}
.now{margin-top:16px;padding:12px 16px;border-radius:var(--r);background:var(--subtle);border:1px solid var(--line);font:500 15px/22px var(--sans)}
.now.run{background:var(--run-bg);border-color:var(--run-bar);border-left:4px solid var(--run-bar);color:var(--fg)}
.now.wait{background:var(--wait-bg);border-color:var(--wait-bar);border-left:4px solid var(--wait-bar);color:var(--fg);font-weight:600}
.now small{display:block;color:var(--wait);margin-top:4px;font:600 13px/20px var(--sans)}
.task{margin-top:12px;display:flex;flex-direction:column;gap:6px}.task div{font-size:14px;line-height:22px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task b{display:inline-block;min-width:84px;font:600 12.5px/22px var(--sans);color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--subtle)}
.kpi{padding:10px 14px;border-left:1px solid var(--line)}.kpi:first-child{border-left:0}
.kpi b{display:block;font:600 18px/24px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kpi b.bad{color:var(--err)}.kpi span{font:500 12.5px/18px var(--sans);color:var(--mut)}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 28px;margin-top:20px}
.ib h5{font:600 12.5px/20px var(--sans);color:var(--mut);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.il{list-style:none;margin:0;padding:0}.il li{display:flex;justify-content:space-between;gap:12px;font:400 12.5px/24px var(--mono);color:var(--sub);border-bottom:1px solid var(--line2)}.il li:last-child{border-bottom:0}
.il li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.il li em{font-style:normal;color:var(--mut);flex:none}
.dh{margin:20px 0 0;font:600 12.5px/20px var(--sans);color:var(--mut)}
.dist{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:8px}.dist i{display:block;background:var(--c)}
.dl{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--sub)}.dl i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}
.trace{margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tr{display:grid;grid-template-columns:70px 22px minmax(140px,300px) minmax(0,1fr);gap:0 10px;align-items:center;min-height:38px;padding:0 16px 0 13px;border-left:3px solid transparent;border-bottom:1px solid var(--line2)}
.tr:hover{background:var(--hover)}.tr.dim{opacity:.3}
.tr.run{background:var(--run-bg);border-left-color:var(--run-bar)}
.tr.err{background:var(--err-bg);border-left-color:var(--err)}
.tr .tm{font:400 12.5px/20px var(--mono);color:var(--mut)}
.si{display:inline-flex;width:18px;height:18px}.si svg{width:18px;height:18px}.si .m{stroke:var(--onicon)}.si.ok{color:var(--run-bar)}.si.err{color:var(--err)}.si.run{color:var(--accent)}
.nm{font:400 13.5px/20px var(--mono);color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm b{font-weight:600;color:var(--fg)}.nm .tg{color:var(--sub)}.nm .x{color:var(--mut)}
.tr.err .nm b{color:var(--err)}
.bw{display:flex;align-items:center;gap:8px;min-width:0}
.bw span.bar2{height:8px;border-radius:2px;background:var(--c);min-width:3px;flex:none}
.bw .du{font:400 12.5px/16px var(--mono);color:var(--mut);white-space:nowrap}.bw .du.slow{color:var(--fg);font-weight:700}
.tr.run .du{color:var(--accent);font-weight:700}.tr.err .du{color:var(--err);font-weight:700}
.ds{color:var(--sub);font-size:13px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sep{display:flex;align-items:center;gap:12px;padding:8px 16px;font-size:13px;color:var(--mut);background:var(--subtle);border-bottom:1px solid var(--line2)}
.sep b{font:700 12.5px/20px var(--sans);color:var(--sub)}.sep.pr b{color:var(--accent)}.sep span{font:400 12px/16px var(--mono)}
.sepw .sx{margin:0;padding:8px 16px 10px 29px;font-size:14px;line-height:22px;color:var(--fg);background:var(--surface);border-bottom:1px solid var(--line2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sepw .sep:not(.pr)+.sx{color:var(--sub)}
.fa{display:flex;gap:8px;margin-top:16px}
#newb{position:sticky;bottom:0;display:flex;justify-content:center;margin-top:12px}
#newb .btn{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:700}
/* dialog + toast */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:20px;width:min(600px,calc(100% - 32px));max-height:80vh;overflow:auto}
dialog::backdrop{background:rgba(7,10,14,.5)}
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}.dhead h2{font:600 18px/26px var(--sans);margin:0}
.dhead .ic2{width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;background:var(--sel);color:var(--accent);flex:none}.dhead .ic2 svg{width:18px;height:18px}
.dstat{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.dstat span{font:500 12.5px/20px var(--sans);padding:0 8px;border:1px solid var(--line);border-radius:var(--r);color:var(--sub);background:var(--subtle)}
dialog h2{font:600 18px/26px var(--sans);margin:0 0 8px}
.dn{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:22px}
.dq{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dr{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.cr{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.cr:hover{background:var(--hover)}.cr[aria-checked="true"]{background:var(--sel);border-color:var(--accent)}
.cr .box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--mut);background:var(--surface);display:flex;align-items:center;justify-content:center;margin-top:2px}
.cr[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent)}
.cr[aria-checked="true"] .box::after{content:"";width:5px;height:9px;border:solid var(--onaccent);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.cr .tx{display:flex;flex-direction:column;min-width:0}.cr .tx b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .mt{font:400 12.5px/20px var(--mono);color:var(--mut)}.cr .sm{font:600 12px/16px var(--sans);color:var(--wait);margin-top:4px}
.dsw{margin:0 0 12px}
.dperm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--subtle);color:var(--sub);cursor:pointer}
.dperm .sw2{position:relative;flex:none;width:34px;height:20px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.dperm .sw2::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:7px;background:var(--mut);transition:transform .12s var(--ease)}
.dperm .tx2{display:flex;flex-direction:column;min-width:0}.dperm .tx2 b{font:600 14px/20px var(--sans);color:var(--fg)}.dperm .tx2 small{font-size:12.5px;line-height:18px;color:var(--mut)}
.dperm[aria-checked="true"]{border-color:var(--err);background:var(--err-bg)}
.dperm[aria-checked="true"] .sw2{background:var(--err);border-color:var(--err)}.dperm[aria-checked="true"] .sw2::after{transform:translateX(14px);background:#fff}

 const note=$('p','dn',K(`${p.name} 프로젝트의 휴면 세션 ${list.length}개입니다. 기본은 선택한 세션의 기록(대화가 담긴 파일과 하위 폴더)을 휴지통 폴더로 옮기는 것이라 되돌릴 수 있습니다. 프로젝트 폴더의 코드와 파일은 건드리지 않습니다. 최근 30분 안에 쓴 세션은 삭제되지 않습니다.`,`${list.length} dormant sessions in ${p.name}. By default the selected session records (the conversation file and its sub-folder) are moved to a trash folder, so you can restore them. Code and files in the project folder are never touched. Sessions used in the last 30 minutes are not deleted.`));
 const rows=$('div','dr'),ok=$('button','btn danger'),cancel=$('button','btn',tt('취소'));
 const sw=$('button','dperm');sw.setAttribute('role','switch');sw.setAttribute('aria-checked','false');sw.append($('span','sw2'),$('span','tx2',''));sw.lastChild.append($('b',0,tt('휴지통 거치지 않고 바로 영구 삭제')),$('small',0,tt('켜면 되돌릴 수 없습니다. 삭제 전에 버튼을 두 번 누르게 합니다')));
 const upd=()=>{ok.textContent=armed?tt('한 번 더 누르면 영구 삭제됩니다'):perm?K(`선택한 ${sel.size}개 영구 삭제`,`Delete ${sel.size} selected permanently`):K(`선택한 ${sel.size}개를 휴지통으로 이동`,`Move ${sel.size} selected to trash`);ok.disabled=!sel.size;
  sw.setAttribute('aria-checked',String(perm));for(const r of rows.children)r.setAttribute('aria-checked',String(sel.has(r.dataset.sid)))};
 for(const s of list){const r=$('button','cr');r.dataset.sid=s.sid;r.setAttribute('role','checkbox');r.setAttribute('aria-checked','false');
  const tx=$('span','tx');tx.append($('b',0,s.title),$('span','mt',[K(`마지막 활동 ${ago(s.lastTs)}`,`Last activity ${ago(s.lastTs)}`),fmtSize(s.size),K(`도구 ${s.nTools}회`,`${s.nTools} tool calls`)].join('  ·  ')));if(isSmall(s))tx.append($('span','sm',tt('작은 세션 (내용이 거의 없음)')));
  r.append($('span','box'),tx);r.onclick=()=>{armed=false;sel.has(s.sid)?sel.delete(s.sid):sel.add(s.sid);upd()};rows.append(r)}
 const q=$('div','dq');
 for(const [l,f] of [[tt('작은 세션 선택'),s=>isSmall(s)],[tt('전체 선택'),()=>true],[tt('선택 해제'),()=>false]]){const b=$('button','btn sm',l);b.onclick=()=>{armed=false;sel.clear();for(const s of list)if(f(s))sel.add(s.sid);upd()};q.append(b)}
 sw.onclick=()=>{perm=!perm;armed=false;upd()};
 const foot=$('div','df');foot.append(cancel,ok);cancel.onclick=()=>dlg.close();
 ok.onclick=async()=>{if(perm&&!armed){armed=true;upd();return}
  ok.disabled=true;try{const r=await post('/api/trash',{dir:p.dir,sids:[...sel],permanent:perm});
   toast(r.error?tt('처리하지 못했습니다'):(perm?K(`${r.moved}개를 영구 삭제했습니다`,`${r.moved} deleted permanently`):K(`${r.moved}개를 휴지통(${r.trash})으로 옮겼습니다`,`${r.moved} moved to trash (${r.trash})`))+(r.skipped.length?K(`. ${r.skipped.length}개는 처리하지 못했습니다(최근 30분 안에 쓴 세션 등)`,`. ${r.skipped.length} could not be handled (for example sessions used in the last 30 minutes)`):''))}catch{toast(tt('처리하지 못했습니다'))}
  dlg.close();view.expanded.delete('dormant');await pollState();psig='';drawProjects(true);refreshTrash();
  if(view.tab==='f'&&sel.has(view.sel&&view.sel.sid))location.hash=pHash()};
 const swr=$('div','dsw');swr.append(sw);
 dlg.append(hd,stats,note,q,rows,swr,foot);upd();dlg.showModal()}
function openTrash(){if(!trashInfo)return;dlg.textContent='';const h=$('h2',0,tt('휴지통 비우기'));h.id='dt';
 const ok=$('button','btn danger',tt('영구 삭제')),cancel=$('button','btn',tt('취소'));
 dlg.append(h,$('p','dn',K(`휴지통 폴더(${trashInfo.dir})에 있는 세션 기록 ${trashInfo.count}개, ${fmtSize(trashInfo.bytes)}를 영구 삭제합니다. 되돌릴 수 없습니다.`,`Permanently deletes ${trashInfo.count} session records (${fmtSize(trashInfo.bytes)}) in the trash folder (${trashInfo.dir}). This cannot be undone.`)));
 const foot=$('div','df');foot.append(cancel,ok);dlg.append(foot);cancel.onclick=()=>dlg.close();
 ok.onclick=async()=>{ok.disabled=true;try{const r=await post('/api/trash/empty',{confirm:true});toast(r.ok?tt('휴지통을 비웠습니다'):tt('비우지 못했습니다'))}catch{toast(tt('비우지 못했습니다'))}dlg.close();refreshTrash()};
 dlg.showModal()}
el('trashb').onclick=openTrash;

/* ---------- controls ---------- */
const q=el('q');q.oninput=()=>{statusBar();drawProjects(true)};
function seg(id,opts,key,after){const w=el(id);const draw=()=>{w.textContent='';for(const [v,l] of opts){const b=$('button',0,l);b.setAttribute('aria-pressed',String(view[key])===v);b.onclick=()=>{view[key]=v;store.set('agent-map-'+key,v);draw();after()};w.append(b)}};draw()}
seg('sortf',[['act',tt('최근 활동순')],['name',tt('이름순')]],'sort',()=>{statusBar();drawProjects(true)});
seg('daysf',[['1',tt('1일')],['3',tt('3일')],['7',tt('7일')],['30',tt('30일')]],'days',pollState);
const sw=el('scr');const setSw=()=>sw.setAttribute('aria-checked',String(view.scr));sw.onclick=()=>{view.scr=!view.scr;setSw();statusBar();drawProjects(true)};setSw();
el('t1').onclick=()=>{location.hash=pHash()};el('t2').onclick=()=>{if(view.sel)location.hash='f/'+encodeURIComponent(view.sel.dir)+'/'+encodeURIComponent(view.sel.sid)};
el('t1').parentElement.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const t=view.tab==='p'?(view.sel?el('t2'):null):el('t1');if(t){e.preventDefault();t.click();t.focus()}});
addEventListener('keydown',e=>{const tag=(document.activeElement||{}).tagName;
 if(e.key==='/'&&tag!=='INPUT'&&tag!=='SELECT'&&view.tab==='p'){e.preventDefault();q.focus()}
 else if(e.key==='Escape'){if(document.activeElement===q&&q.value){q.value='';statusBar();drawProjects(true)}else if(view.tab==='f')location.hash=pHash()}});
const TH=['soft','light','dark'],THN={soft:tt('소프트'),light:tt('라이트'),dark:tt('다크')};let th=store.get('agent-map-theme');if(!TH.includes(th))th='soft';{const qt=new URLSearchParams(location.search).get('theme');if(TH.includes(qt))th=qt} /* ?theme=soft|light|dark, handy for screenshots */
const thb=el('th');const setTheme=t=>{th=t;document.documentElement.dataset.theme=t;thb.textContent=tt('화면 ')+THN[t];store.set('agent-map-theme',t)};thb.onclick=()=>setTheme(TH[(TH.indexOf(th)+1)%TH.length]);
let zoom=+(store.get('agent-map-zoom')||1);const setZoom=z=>{zoom=Math.min(1.5,Math.max(.8,Math.round(z*100)/100));document.documentElement.style.zoom=zoom;store.set('agent-map-zoom',zoom)};
el('zi').onclick=()=>setZoom(zoom+.1);el('zo').onclick=()=>setZoom(zoom-.1);
let roNote='';fetch('/api/mode').then(r=>r.json()).then(m=>{if(m.readonly){document.body.classList.add('ro');roNote=tt(' · 읽기 전용 접속')}}).catch(()=>{});
function localize(){document.documentElement.lang='en';const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);for(let n;n=w.nextNode();){const t=n.nodeValue.trim();if(t&&EN[t])n.nodeValue=n.nodeValue.replace(t,EN[t])}for(const e of document.querySelectorAll('[title],[aria-label],[placeholder]'))for(const a of ['title','aria-label','placeholder']){const v=e.getAttribute(a);if(v&&EN[v])e.setAttribute(a,EN[v])}document.title=EN[document.title]||document.title}
el('lg').textContent=LANG==='en'?'한국어':'English';el('lg').onclick=()=>{store.set('agent-map-lang',LANG==='en'?'ko':'en');location.reload()};
if(LANG==='en')localize();
setTheme(th);setZoom(zoom);legend();route();tick();refreshTrash();setInterval(refreshTrash,15000);
