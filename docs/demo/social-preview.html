<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>agent-map social preview</title>
<style>
/* 1280x640 card for GitHub's social preview. Render: msedge --headless=new --window-size=1280,640 --screenshot=social-preview.png social-preview.html */
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#0e1118;color:#e9ecf3;font:400 28px/1.35 "Segoe UI","Pretendard","Malgun Gothic",system-ui,sans-serif;position:relative}
.glow{position:absolute;right:-180px;top:-140px;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,120,220,.30),transparent)}
.left{position:absolute;left:72px;top:96px;width:520px}
.tag{display:inline-block;font:600 18px/1 "Cascadia Mono",Consolas,monospace;color:#7fb0ff;border:1px solid rgba(127,176,255,.4);border-radius:8px;padding:8px 12px;margin-bottom:28px}
h1{margin:0 0 20px;font:700 76px/1.02 "Segoe UI",system-ui,sans-serif;letter-spacing:-1px}
p{margin:0 0 28px;color:#b6bdcc;font-size:29px}
ul{list-style:none;margin:0;padding:0;font-size:23px;color:#d5daE6}
li{margin:0 0 10px;padding-left:30px;position:relative}li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;background:#3fb27f}
li:nth-child(2)::before{background:#e0954a}li:nth-child(3)::before{background:#8a73d6}
.shot{position:absolute;left:640px;top:84px;width:700px;height:520px;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12)}
.shot img{width:1120px;display:block;margin:-6px 0 0 -4px}
.foot{position:absolute;left:72px;bottom:44px;font:500 16px/1 "Cascadia Mono",Consolas,monospace;color:#7c8598}
</style></head><body>
<div class="glow"></div>
<div class="left">
  <span class="tag">Claude Code plugin</span>
  <h1>agent-map</h1>
  <p>See what every Claude Code session is doing, live.</p>
  <ul><li>Live dashboard per project</li><li>Step-by-step flow with timings</li><li>Config map of skills, agents, MCP</li></ul>
</div>
<div class="shot"><img src="../images/live-projects-dark.png" alt=""></div>
<div class="foot">local-first · zero dependencies · no model tokens</div>
</body></html>
